<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resilient SOC | Cybersecurity &amp; Security Operations</title>
<meta name="description" content="Resilient SOC provides practical cybersecurity capabilities including SOC operations, security monitoring, threat detection, threat hunting, log investigation, and incident response.">
<meta name="keywords" content="Cybersecurity, SOC, Security Operations, Threat Detection, SIEM, Threat Hunting, Incident Investigation, Log Analysis, Detection Engineering, Phishing Analysis">
<link rel="icon" type="image/png" href="assets/resilient-soc-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D12;
  --bg-elevated:#0F141B;
  --bg-elevated-2:#131A23;
  --border:#1D2733;
  --border-soft:#161E28;
  --text:#E7ECF1;
  --text-muted:#8C99A8;
  --text-dim:#5B6675;
  --accent:#5EEAD4;
  --accent-dim:#2F6E63;
  --accent-glow:rgba(94,234,212,0.14);
  --sev-high:#F0554A;
  --sev-med:#F5A524;
  --sev-low:#3E9BFF;
  --radius:10px;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --maxw:1200px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
  overflow-x:hidden;
  position:relative;
}
img,svg{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

/* background grid texture */
.grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(94,234,212,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(94,234,212,0.035) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
}

.wrap{max-width:var(--maxw);margin:0 inset auto;padding:0 28px;position:relative;z-index:1;}
.wrap{margin-left:auto;margin-right:auto;}
section{position:relative;z-index:1;}

.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent);
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:16px;
}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}

h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;color:var(--text);}
.section-title{font-size:clamp(28px,3.6vw,42px);line-height:1.15;max-width:680px;}
.section-sub{color:var(--text-muted);max-width:560px;margin-top:14px;font-size:16px;}
.section-pad{padding:96px 0;}
@media (max-width:768px){.section-pad{padding:64px 0;}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 26px;border-radius:6px;font-weight:600;font-size:14.5px;
  border:1px solid transparent;cursor:pointer;transition:all .2s ease;
  font-family:var(--font-body);
}
.btn-primary{background:var(--accent);color:#06231D;}
.btn-primary:hover{background:#7FF3E0;transform:translateY(-1px);box-shadow:0 8px 24px -8px var(--accent-glow);}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--accent-dim);background:rgba(94,234,212,0.05);}

/* NAVBAR */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:18px 0;transition:all .3s ease;
  border-bottom:1px solid transparent;
}
.navbar.scrolled{
  background:rgba(10,13,18,0.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
  padding:13px 0;
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:0.01em;}
.logo-mark{width:30px;height:30px;flex-shrink:0;}
.nav-links{display:flex;gap:34px;align-items:center;}
.nav-links a{font-size:14.5px;color:var(--text-muted);font-weight:500;transition:color .2s;position:relative;}
.nav-links a:hover{color:var(--text);}
.nav-right{display:flex;align-items:center;gap:20px;}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;z-index:110;}
.hamburger span{width:22px;height:2px;background:var(--text);transition:all .3s;}
.mobile-menu{
  position:fixed;inset:0;background:var(--bg);z-index:105;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.mobile-menu.open{opacity:1;pointer-events:all;}
.mobile-menu a{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--text);}

@media (max-width:900px){
  .nav-links{display:none;}
  .nav-right .btn-primary{display:none;}
  .hamburger{display:flex;}
}

/* HERO */
.hero{
  padding:180px 0 100px;
  position:relative;
  overflow:hidden;
}
.hero-inner{display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;}
@media (max-width:960px){.hero-inner{grid-template-columns:1fr;}}
.hero h1{font-size:clamp(38px,5.4vw,62px);line-height:1.06;letter-spacing:-0.02em;}
.hero h1 .accent-word{color:var(--accent);}
.hero-sub{color:var(--text-muted);font-size:17px;max-width:520px;margin:22px 0 32px;}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;}

/* watermark logo */
.watermark{
  position:absolute;pointer-events:none;z-index:0;opacity:0.05;
  animation:wm-drift 26s ease-in-out infinite;
  object-fit:contain;
  filter:drop-shadow(0 0 40px rgba(94,234,212,0.06));
}
@keyframes wm-drift{0%,100%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(-8px,10px) rotate(2deg);}}
.hero .watermark{top:-120px;right:-160px;width:640px;height:640px;}
.about .watermark{bottom:-200px;left:-220px;width:700px;height:700px;}
@media (max-width:768px){.watermark{opacity:0.035;transform:scale(0.7);}}

/* SOC visual panel in hero */
.soc-panel{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;position:relative;overflow:hidden;
  box-shadow:0 30px 80px -30px rgba(0,0,0,0.6);
}
.soc-panel::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 80% 0%, var(--accent-glow), transparent 60%);
  pointer-events:none;
}
.soc-panel-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.soc-panel-title{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);letter-spacing:0.08em;text-transform:uppercase;}
.dot-row{display:flex;gap:6px;}
.dot-row span{width:8px;height:8px;border-radius:50%;background:var(--border);}
.telemetry-line{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--font-mono);font-size:12px;color:var(--text-muted);
  padding:8px 0;border-bottom:1px solid var(--border-soft);
}
.telemetry-line:last-child{border-bottom:none;}
.telemetry-line .tl-event{color:var(--text);}
.pulse-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;position:relative;}
.pulse-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid currentColor;animation:pulse-ring 2s ease-out infinite;}
.pulse-dot.high{background:var(--sev-high);color:var(--sev-high);}
.pulse-dot.med{background:var(--sev-med);color:var(--sev-med);}
.pulse-dot.low{background:var(--sev-low);color:var(--sev-low);}
@keyframes pulse-ring{0%{transform:scale(0.6);opacity:0.8;}100%{transform:scale(2.2);opacity:0;}}
.mini-chart{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:14px;}
.mini-chart span{flex:1;background:linear-gradient(to top, var(--accent-dim), var(--accent));border-radius:2px 2px 0 0;opacity:0.75;animation:bar-grow 3s ease-in-out infinite alternate;}

/* TRUST BAR */
.trust-bar{border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:34px 0;}
.trust-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;}
.trust-item{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:13px;color:var(--text-muted);transition:color .2s;}
.trust-item:hover{color:var(--accent);}
.trust-item svg{width:16px;height:16px;stroke:currentColor;flex-shrink:0;}

/* SERVICES */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:52px;}
@media (max-width:960px){.services-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.services-grid{grid-template-columns:1fr;}}
.service-card{
  background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:26px;transition:all .25s ease;cursor:default;position:relative;
}
.service-card:hover{border-color:var(--accent-dim);transform:translateY(-3px);background:var(--bg-elevated-2);}
.service-icon{width:38px;height:38px;border-radius:8px;background:rgba(94,234,212,0.08);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.service-icon svg{width:19px;height:19px;stroke:var(--accent);}
.service-card h3{font-size:17px;margin-bottom:8px;font-weight:600;}
.service-card p{color:var(--text-muted);font-size:14.5px;line-height:1.6;}
.card-more{margin-top:16px;font-family:var(--font-mono);font-size:12px;color:var(--accent);display:inline-flex;align-items:center;gap:6px;opacity:0.85;}

/* CAPABILITIES */
.cap-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:48px;}
@media (max-width:900px){.cap-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:560px){.cap-grid{grid-template-columns:repeat(2,1fr);}}
.cap-chip{
  border:1px solid var(--border-soft);border-radius:8px;padding:18px 14px;text-align:center;
  font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);cursor:pointer;
  transition:all .2s ease;background:var(--bg-elevated);
}
.cap-chip:hover,.cap-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(94,234,212,0.06);}
.cap-detail{
  margin-top:22px;border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:22px 26px;background:var(--bg-elevated);font-size:14.5px;color:var(--text-muted);
  min-height:26px;
}
.cap-detail strong{color:var(--text);font-family:var(--font-mono);font-size:13px;letter-spacing:0.04em;text-transform:uppercase;display:block;margin-bottom:8px;}

/* HOW WE WORK */
.workflow{display:flex;justify-content:space-between;margin-top:56px;position:relative;gap:8px;}
.workflow::before{content:"";position:absolute;top:22px;left:0;right:0;height:1px;background:var(--border);}
@media (max-width:860px){.workflow{flex-direction:column;gap:28px;}.workflow::before{top:0;bottom:0;left:22px;right:auto;width:1px;height:auto;}}
.wf-step{flex:1;position:relative;}
@media (max-width:860px){.wf-step{display:flex;gap:18px;align-items:flex-start;}}
.wf-num{
  width:44px;height:44px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;color:var(--accent);
  margin-bottom:16px;position:relative;z-index:1;flex-shrink:0;
}
.wf-step h4{font-size:16px;margin-bottom:8px;}
.wf-step p{color:var(--text-muted);font-size:13.5px;max-width:200px;}

/* SOC WORKFLOW VISUAL (pipeline) */
.pipeline{
  display:flex;align-items:center;justify-content:space-between;margin-top:48px;
  background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:30px 20px;overflow-x:auto;gap:6px;
}
.pipe-node{
  font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);text-align:center;
  padding:12px 14px;border:1px solid var(--border-soft);border-radius:8px;white-space:nowrap;
  background:var(--bg-elevated-2);flex-shrink:0;position:relative;
}
.pipe-node.active-flow{color:var(--accent);border-color:var(--accent-dim);}
.pipe-arrow{color:var(--text-dim);flex-shrink:0;font-size:14px;}
@media (max-width:768px){.pipeline{flex-direction:column;align-items:stretch;}.pipe-arrow{transform:rotate(90deg);align-self:center;}}

/* LABS */
.labs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px;}
@media (max-width:1000px){.labs-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.labs-grid{grid-template-columns:1fr;}}
.lab-card{
  border:1px solid var(--border-soft);border-radius:var(--radius);padding:22px;background:var(--bg-elevated);
  transition:all .25s ease;
}
.lab-card:hover{border-color:var(--accent-dim);transform:translateY(-2px);}
.lab-tag{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:0.06em;text-transform:uppercase;}
.lab-card h4{font-size:15.5px;margin:10px 0 12px;}
.lab-meta{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-muted);margin-bottom:14px;}
.lab-meta span b{color:var(--text-dim);font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;margin-right:6px;}
.lab-cta{font-family:var(--font-mono);font-size:12px;color:var(--accent);}

/* ALERT CENTER */
.sim-label{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;
  color:var(--text-dim);border:1px solid var(--border-soft);padding:5px 12px;border-radius:20px;margin-bottom:24px;
}
.sim-label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--text-dim);}
.alert-table{border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;background:var(--bg-elevated);}
.alert-row{
  display:grid;grid-template-columns:90px 1fr 130px 110px 90px;gap:14px;padding:16px 22px;align-items:center;
  border-bottom:1px solid var(--border-soft);font-size:13.5px;
}
.alert-row:last-child{border-bottom:none;}
.alert-row.head{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;padding:12px 22px;}
@media (max-width:768px){.alert-row{grid-template-columns:1fr;gap:6px;padding:16px;}.alert-row.head{display:none;}}
.sev-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.04em;padding:3px 9px;border-radius:4px;width:fit-content;}
.sev-badge.high{background:rgba(240,85,74,0.12);color:var(--sev-high);}
.sev-badge.med{background:rgba(245,165,36,0.12);color:var(--sev-med);}
.sev-badge.low{background:rgba(62,155,255,0.12);color:var(--sev-low);}
.alert-event{color:var(--text);}
.alert-time,.alert-source{color:var(--text-muted);font-family:var(--font-mono);font-size:12.5px;}
.status-chip{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);display:flex;align-items:center;gap:6px;}
.status-chip .pulse-dot{width:6px;height:6px;}

/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px;}
@media (max-width:900px){.dash-grid{grid-template-columns:repeat(2,1fr);}}
.dash-card{border:1px solid var(--border-soft);border-radius:var(--radius);padding:22px;background:var(--bg-elevated);}
.dash-label{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;}
.dash-value{font-family:var(--font-display);font-size:30px;font-weight:600;color:var(--text);}
.dash-value span{color:var(--accent);font-size:15px;font-family:var(--font-mono);margin-left:6px;}
.dash-bars{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:12px;}
.dash-bars span{flex:1;background:var(--accent-dim);border-radius:1px;}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;margin-top:44px;}
@media (max-width:860px){.about-grid{grid-template-columns:1fr;gap:32px;}}
.mvv{display:flex;flex-direction:column;gap:26px;}
.mvv-item{border-left:2px solid var(--border);padding-left:18px;}
.mvv-item h4{font-family:var(--font-mono);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
.mvv-item p{color:var(--text-muted);font-size:14.5px;}

/* TEAM */
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px;}
@media (max-width:768px){.team-grid{grid-template-columns:1fr;}}
.team-card{border:1px solid var(--border-soft);border-radius:var(--radius);padding:26px;background:var(--bg-elevated);text-align:center;}
.team-avatar{
  width:76px;height:76px;border-radius:50%;margin:0 auto 16px;
  background:linear-gradient(135deg, var(--bg-elevated-2), var(--border));
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:20px;color:var(--text-dim);
}
.team-card h4{font-size:16px;}
.team-role{color:var(--accent);font-family:var(--font-mono);font-size:12px;margin:6px 0 14px;}
.team-skills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;}
.team-skills span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);border:1px solid var(--border-soft);padding:3px 9px;border-radius:12px;}
.team-links{display:flex;gap:14px;justify-content:center;}
.team-links a{color:var(--text-dim);transition:color .2s;}
.team-links a:hover{color:var(--accent);}
.team-links svg{width:17px;height:17px;}

/* CONTACT */
.contact-grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:56px;margin-top:44px;}
@media (max-width:900px){.contact-grid{grid-template-columns:1fr;}}
.contact-info-item{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:14.5px;color:var(--text-muted);transition:color .2s;width:fit-content;}
.contact-info-item svg{width:17px;height:17px;stroke:var(--accent);flex-shrink:0;}
a.contact-info-item:hover{color:var(--accent);}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
.form-group input,.form-group select,.form-group textarea{
  width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;
  padding:12px 14px;color:var(--text);font-size:14.5px;transition:border-color .2s;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);outline:none;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:560px){.form-row{grid-template-columns:1fr;}}
.form-note{font-size:12px;color:var(--text-dim);margin-top:10px;}
.success-box{
  display:none;border:1px solid var(--accent-dim);background:rgba(94,234,212,0.06);border-radius:var(--radius);
  padding:28px;text-align:center;
}
.success-box.show{display:block;animation:fade-in .4s ease;}
.success-icon{width:44px;height:44px;border-radius:50%;background:rgba(94,234,212,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.success-icon svg{width:22px;height:22px;stroke:var(--accent);}
@keyframes fade-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* FINAL CTA */
.final-cta{
  text-align:center;padding:100px 28px;border-top:1px solid var(--border-soft);
  position:relative;
}
.final-cta h2{font-size:clamp(30px,4.4vw,50px);max-width:700px;margin:0 auto 26px;}

/* FOOTER */
footer{border-top:1px solid var(--border-soft);padding:56px 0 32px;}
.footer-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:32px;padding-bottom:36px;}
.footer-brand .logo{margin-bottom:10px;}
.footer-brand p{color:var(--text-dim);font-family:var(--font-mono);font-size:12.5px;}
.footer-links{display:flex;gap:60px;flex-wrap:wrap;}
.footer-col h5{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px;}
.footer-col a{display:block;color:var(--text-muted);font-size:13.5px;margin-bottom:10px;transition:color .2s;}
.footer-col a:hover{color:var(--accent);}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:24px;border-top:1px solid var(--border-soft);flex-wrap:wrap;gap:14px;}
.footer-bottom p{color:var(--text-dim);font-size:12.5px;}
.footer-social{display:flex;gap:16px;}
.footer-social a{color:var(--text-dim);}
.footer-social a:hover{color:var(--accent);}
.footer-social svg{width:17px;height:17px;}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s ease;}
.reveal.in{opacity:1;transform:translateY(0);}

/* loading screen */
#loader{
  position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .5s ease, visibility .5s ease;
}
#loader.hide{opacity:0;visibility:hidden;}
.loader-mark{width:52px;height:52px;animation:loader-pulse 1.4s ease-in-out infinite;}
@keyframes loader-pulse{0%,100%{opacity:0.5;transform:scale(0.94);}50%{opacity:1;transform:scale(1);}}
.loader-text{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);letter-spacing:0.1em;}
</style>
</head>
